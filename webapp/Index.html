<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#F6F4EF;--surface:#FFFFFF;--text:#1E2622;--sub:#5C6660;--line:#E4E0D8;--green:#2E6B57;--on-green:#FFFFFF;--green-bg:#E3EFE8;--green-text:#1F5242;--rose-bg:#F8E7E2;--rose-text:#8A3628;--amber-bg:#FBF0D9;--amber-text:#6E4A0E;--chip:#EFECE6;--pink-bg:#F6E6EE;--pink-text:#7A2E52}
@media (prefers-color-scheme: dark){:root{--bg:#121715;--surface:#1C2320;--text:#EAEFEC;--sub:#A3ADA8;--line:#2C3531;--green:#7CC4A8;--on-green:#0F1F19;--green-bg:#1F3A30;--green-text:#A9DCC7;--rose-bg:#3D2420;--rose-text:#F2BDB2;--amber-bg:#3A2F17;--amber-text:#F0CF8A;--chip:#26302C;--pink-bg:#3A2230;--pink-text:#F2BFD6}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:110px}
.serif{font-family:'Gowun Batang',serif;font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px}
.top .title{font-size:15px;font-weight:500}
.ibtn{width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:12px;flex-shrink:0}
.ibtn:hover{background:var(--chip)}
.btn{min-height:40px;padding:0 16px;border-radius:10px;border:0;background:var(--green);color:var(--on-green);font-size:14px;font-weight:500}
.btn.line{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--rose-text);border:1px solid var(--line)}
.btn.wide{width:100%;min-height:48px;font-size:15px}
.btn:disabled{opacity:.6}
.pad{padding:0 20px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px}
.sec{padding:18px;display:flex;flex-direction:column;gap:14px}
.sec h2{margin:0;font-size:15px;font-weight:700}
.row-between{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.muted{color:var(--sub)}
.small{font-size:12px}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.chip.green{background:var(--green-bg);color:var(--green-text)}
.chip.rose{background:var(--rose-bg);color:var(--rose-text)}
.chip.amber{background:var(--amber-bg);color:var(--amber-text)}
.chip.pink{background:var(--pink-bg);color:var(--pink-text)}
.chip.gray{background:var(--chip);color:var(--sub)}
.chip.plain{background:var(--chip);color:var(--text);font-weight:500}
button.chip{border:0;min-height:32px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--sub)}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:15px;color:var(--text);min-width:0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:12px;background:var(--chip);flex:1;max-width:360px}
.tabs button{min-height:38px;border-radius:9px;border:0;background:transparent;color:var(--sub);font-size:14px}
.tabs button.on{background:var(--surface);color:var(--text);font-weight:500}
.check-line{display:flex;align-items:center;gap:8px;font-size:14px}
.check-line .mk{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.filters button.on{background:var(--green);color:var(--on-green);border-color:var(--green);font-weight:500}
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:0 20px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item.open{border:1.5px solid var(--green)}
.item-main{width:100%;border:0;background:transparent;text-align:left;padding:12px 14px;display:flex;gap:12px;align-items:center}
.thumb{position:relative;width:48px;height:56px;flex-shrink:0;border-radius:12px;background:var(--green-bg);color:var(--green-text);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .no{position:absolute;left:4px;top:4px;font-size:10px;font-weight:700;padding:1px 5px;border-radius:6px;background:var(--surface);color:var(--sub)}
.edu{display:flex;gap:3px}
.edu span{width:18px;height:18px;border-radius:5px;font-size:10px;font-weight:500;display:flex;align-items:center;justify-content:center;background:var(--chip);color:var(--sub)}
.edu span.done{background:var(--green);color:var(--on-green)}
.members{border-top:1px solid var(--line);background:var(--bg);padding:4px 14px 8px 74px}
.members button{width:100%;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;border-bottom:1px solid var(--line);background:transparent;font-size:14px;text-align:left}
.members button:last-child{border-bottom:0}
.linkbtn{border:0;background:transparent;color:var(--green);font-size:13px;font-weight:500;min-height:36px;padding:0}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--sub)}
.field input,.field select,.field textarea,.inp{height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px;min-width:0;width:100%}
.field textarea{height:auto;padding:10px 12px;line-height:1.6;resize:vertical;min-height:96px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.seg label{min-height:44px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;cursor:pointer;padding:0 4px;text-align:center;word-break:keep-all}
.seg label input{width:18px;height:18px}
input[type=date]{position:relative}
input[type=date][data-empty="1"]:not(:focus){color:transparent}
input[type=date][data-empty="1"]:not(:focus)::-webkit-datetime-edit{color:transparent}
input[type=date][data-empty="1"]:not(:focus)::before{content:attr(data-ph);color:var(--sub);position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none}
.seg label.on{border:2px solid var(--green);background:var(--green-bg);color:var(--green-text);font-weight:500}
input[type=checkbox],input[type=radio]{accent-color:var(--green);width:20px;height:20px;margin:0;flex-shrink:0}
.check-row{display:flex;align-items:center;justify-content:space-between;min-height:44px;font-size:15px;gap:10px}
.edu-box{min-height:58px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;gap:10px;cursor:pointer}
.edu-box.done{border-color:var(--green);background:var(--green-bg);color:var(--green-text)}
.info-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.info-row:last-child{border-bottom:0}
.info-row span:last-child{font-weight:500;text-align:right}
.photo{position:relative;flex-shrink:0}
.photo .frame{width:100%;height:100%;border-radius:22px;background:var(--green-bg);color:var(--green-text);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.photo.rose .frame{background:var(--rose-bg);color:var(--rose-text)}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .cam{position:absolute;right:-8px;bottom:-8px;width:44px;height:44px;border-radius:50%;border:3px solid var(--bg);background:var(--green);color:var(--on-green);display:flex;align-items:center;justify-content:center;cursor:pointer}
.sil{opacity:.45}
.addbtn{min-height:48px;border-radius:14px;border:1.5px dashed var(--line);background:transparent;color:var(--green);display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:500;width:100%}
.err{color:var(--rose-text);font-size:13px;min-height:18px}
.notice{padding:12px 14px;border-radius:12px;background:var(--green-bg);color:var(--green-text);font-size:13px;line-height:1.6;margin:0}
.lockbar{min-height:48px;padding:0 16px;border-radius:14px;background:var(--chip);color:var(--sub);display:flex;align-items:center;gap:10px;font-size:13px;border:0;width:100%;text-align:left}
.footer{text-align:center;font-size:11px;color:var(--sub);padding:20px 0 8px;letter-spacing:.3px}
.home-card{display:flex;flex-direction:column;gap:14px;padding:20px;border-radius:20px;background:var(--surface);border:1px solid var(--line);width:100%;text-align:left}
.home-card .ico{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.big{font-size:40px;font-weight:700;letter-spacing:-1px}
.log{display:flex;flex-direction:column;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.log div{padding:12px 16px;display:flex;justify-content:space-between;gap:12px;font-size:13px;border-bottom:1px solid var(--line)}
.log div:last-child{border-bottom:0}
.fab{position:fixed;right:max(20px,calc(50% - 340px));bottom:calc(96px + env(safe-area-inset-bottom));height:52px;padding:0 20px;border-radius:26px;border:0;background:var(--green);color:var(--on-green);display:flex;align-items:center;gap:6px;font-size:15px;font-weight:500;z-index:5}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6}
nav.bottom .in{display:flex;justify-content:space-around;width:100%;max-width:720px;padding:8px 0 calc(10px + env(safe-area-inset-bottom))}
nav.bottom button{min-width:64px;min-height:44px;border:0;background:transparent;color:var(--sub);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.bottom button.on{color:var(--green);font-weight:500}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:340px}
.key{height:62px;border-radius:16px;border:0;background:var(--surface);font-size:24px;font-weight:500}
.key.ok{background:var(--green);color:var(--on-green);font-size:17px}
.pin{display:flex;gap:16px;min-height:32px;align-items:center}
.pin span{width:16px;height:16px;border-radius:50%;border:2px solid var(--line)}
.pin span.on{background:var(--green);border-color:var(--green)}
#toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:20;text-align:center}
#toast.show{opacity:1}
#busy{position:fixed;left:0;top:0;height:3px;width:100%;background:var(--green);transform-origin:left;animation:busy 1.2s ease-in-out infinite;z-index:30;display:none}
#busy.show{display:block}
@keyframes busy{0%{transform:scaleX(0)}60%{transform:scaleX(.8)}100%{transform:scaleX(1);opacity:0}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}
.modal .box{background:var(--surface);border-radius:18px;padding:22px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:18px}
.modal p{margin:0;font-size:15px;line-height:1.6}
.modal .acts{display:flex;gap:8px;justify-content:flex-end}
.empty{padding:40px 20px;text-align:center;color:var(--sub);font-size:14px;line-height:1.7}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hide-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
@media (min-width:900px){
  .wrap{max-width:1040px}
  .list{grid-template-columns:repeat(2,minmax(0,1fr))}
  .narrow{max-width:640px;margin:0 auto}
  nav.bottom .in{max-width:1040px}
  .fab{right:max(20px,calc(50% - 500px))}
}
</style>
</head>
<body>
<div id="busy"></div>
<div id="app" class="wrap"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
'use strict';

/* ---------- 상태 ---------- */
var S = {
  token: null, roles: [], data: null, version: '0', lastSync: null,
  screen: 'loading', params: {}, draft: null, draftKey: null, dirty: false,
  code: '', loginMsg: '', loginLocked: false,
  qNew: '', filterNew: 'all', tabNew: 'active', yearNew: 'all', openFam: {}, qPat: '', filterPat: 'all', qPreg: '', filterPreg: 'all',
  photo: {}, busy: 0, err: {}
};
var EDU = ['1강', '2강', '3강', '4강'];
var NEW_EDITABLE = ['관계', '신앙세대주', '이름', '성별', '연생', '등록일', '인도자', '1강', '2강', '3강', '4강', '등록심방', '전도회', '목장연결', '목장', '신급', '수료식'];
var PAT_EDITABLE = ['이름', '성별', '연생', '병명', '병원', '상황', '상황메모', '다음진료일', '직분', '최근통화'];
var GRADES = ['학습', '세례', '입교', '없음'];
var PREG_EDITABLE = ['이름', '연생', '아기성별', '출산예정일', '몇째', '메모', '조리원', '조리원입소', '조리원퇴소', '출산방법', '직분'];
var BIRTH_WAYS = ['자연분만', '제왕절개', '미정'];
var BABY = ['아들', '딸', '미정'];
var ORDERS = ['첫째', '둘째', '셋째', '넷째 이상'];
var STATUSES = ['입원', '통원치료', '재활', '가료', '요양', '정기검진', '그 외'];
var RELATIONS = ['본인', '남편', '아내', '아들', '딸', '아버지', '어머니', '형제자매', '기타'];
var app = document.getElementById('app');

function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
var DEVICE = load('yb_device');
if (!DEVICE) { DEVICE = 'd' + Math.random().toString(36).slice(2) + Date.now().toString(36); store('yb_device', DEVICE); }

/* ---------- 도구 ---------- */
function esc(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function today() { return (S.data && S.data.today) || new Date().toISOString().slice(0, 10); }
function fmtDate(d) { if (!d) return ''; var p = String(d).split('-'); return p.length === 3 ? p[0] + '. ' + Number(p[1]) + '. ' + Number(p[2]) : d; }
function shortDate(d) { if (!d) return ''; var p = String(d).split('-'); return p.length === 3 ? p[1] + '.' + p[2] : d; }
function birthLabel(y) { y = String(y || '').trim(); return /^\d{4}$/.test(y) ? y.slice(2) + '년생' : (y ? y : ''); }
function dayDiff(d) {
  if (!d || !/^\d{4}-\d{2}-\d{2}$/.test(d)) return null;
  var a = new Date(today() + 'T00:00:00'), b = new Date(d + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}
function dLabel(n) { return n === null ? '' : (n === 0 ? '오늘' : (n > 0 ? 'D-' + n : 'D+' + (-n))); }
function weekday(d) { var n = new Date(d + 'T00:00:00').getDay(); return ['일', '월', '화', '수', '목', '금', '토'][n]; }
function relTime(t) {
  if (!t) return '';
  var d = new Date(String(t).replace(' ', 'T') + ':00');
  var m = Math.round((Date.now() - d.getTime()) / 60000);
  if (isNaN(m)) return t;
  if (m < 1) return '방금';
  if (m < 60) return m + '분 전';
  if (m < 60 * 24) return Math.floor(m / 60) + '시간 전';
  if (m < 60 * 48) return '어제';
  return (d.getMonth() + 1) + '/' + d.getDate();
}
function pad2(n) { n = String(n || ''); return n.length < 2 ? '0' + n : n; }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function canViewNew() { return S.roles.indexOf('newView') >= 0 || S.roles.indexOf('newEdit') >= 0; }
function canEditNew() { return S.roles.indexOf('newEdit') >= 0; }
function canPat() { return S.roles.indexOf('patient') >= 0; }
function canPreg() { return S.roles.indexOf('pregnancy') >= 0; }
function pregs() { return (S.data && S.data.pregnancies) || []; }
function careState(p) {
  var a = dayDiff(p['조리원입소']), b = dayDiff(p['조리원퇴소']);
  if (a === null) return '';
  if (a > 0) return 'before';
  if (b === null || b >= 0) return 'now';
  return 'after';
}
function careLabel(p) {
  if (!p['조리원입소'] && !p['조리원']) return '';
  var range = p['조리원입소'] ? shortDate(p['조리원입소']) + (p['조리원퇴소'] ? '~' + shortDate(p['조리원퇴소']) : '~') : '날짜 미정';
  return '조리원 ' + (p['조리원'] ? p['조리원'] + ' ' : '') + range;
}
function findPreg(id) { return pregs().filter(function (p) { return p.ID === id; })[0]; }
function newcomers() { return (S.data && S.data.newcomers) || []; }
function patients() { return (S.data && S.data.patients) || []; }
function findNew(id) { return newcomers().filter(function (p) { return p.ID === id; })[0]; }
function findPat(id) { return patients().filter(function (p) { return p.ID === id; })[0]; }
function eduCount(p) { return EDU.filter(function (k) { return p[k]; }).length; }
function missions(gender) {
  var n = gender === '남' ? 10 : (gender === '여' ? 15 : 0), out = [];
  for (var i = 1; i <= n; i++) out.push(i + gender + '전도회');
  return out;
}
function families() {
  var map = {}, order = [];
  newcomers().forEach(function (p) {
    var f = p['가족ID'] || p.ID;
    if (!map[f]) { map[f] = []; order.push(f); }
    map[f].push(p);
  });
  return order.map(function (f) {
    var ms = map[f];
    var head = ms.filter(function (m) { return m['신앙세대주'] === 'Y'; })[0] || ms[0];
    var others = ms.filter(function (m) { return m !== head; }).sort(function (a, b) { return (Number(a['연번']) || 0) - (Number(b['연번']) || 0); });
    return { id: f, head: head, others: others, all: ms };
  });
}
function famDone(f) { return f.all.every(function (p) { return !!p['완료일']; }); }
function famYear(f) { return String(f.head['등록일'] || '').slice(0, 4); }
function personReady(p) { return eduCount(p) === 4 && !!p['수료식'] && p['목장연결'] === 'Y'; }
function famReady(f) { return f.all.every(personReady); }
function newYears() {
  var ys = {};
  families().forEach(function (f) { var y = famYear(f); if (/^\d{4}$/.test(y)) ys[y] = 1; });
  return Object.keys(ys).sort().reverse();
}
function scopeFams() {
  return families().filter(function (f) {
    return (S.tabNew === 'done') === famDone(f) && (S.yearNew === 'all' || famYear(f) === S.yearNew);
  });
}
function familyOf(p) { return families().filter(function (f) { return f.all.indexOf(p) >= 0; })[0]; }

/* ---------- 아이콘 ---------- */
var I = {
  back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  close: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',

/* ---------- 서버 호출 ---------- */
function setBusy(d) { S.busy = Math.max(0, S.busy + d); document.getElementById('busy').className = S.busy ? 'show' : ''; }
function call(fn, args, quiet) {
  return new Promise(function (resolve, reject) {
    if (!quiet) setBusy(1);
    var r = google.script.run
      .withSuccessHandler(function (v) { if (!quiet) setBusy(-1); resolve(v); })
      .withFailureHandler(function (e) { if (!quiet) setBusy(-1); handleError(e, quiet); reject(e); });
    r[fn].apply(r, args || []);
  });
}
function handleError(e, quiet) {
  var msg = (e && e.message) || String(e || '');
  if (msg.indexOf('NEED_CODE') >= 0) {
    S.token = null; S.roles = []; S.data = null; store('yb_token', null);
    S.loginMsg = '코드 유효 시간이 지났어요. 다시 입력해 주세요.';
    go('login');
    return;
  }
  if (quiet) return;
  if (msg.indexOf('NO_PERMISSION') >= 0) toast('이 코드로는 할 수 없는 일이에요.');
  else toast(msg.replace(/^Error:\s*/, '') || '문제가 생겼어요. 잠시 뒤에 다시 해 주세요.');
}
var toastTimer;
function toast(m) {
  var t = document.getElementById('toast');
  t.textContent = m; t.className = 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.className = ''; }, 2600);
}
function confirmBox(msg, okLabel) {
  return new Promise(function (resolve) {
    var m = document.createElement('div');
    m.className = 'modal';
    m.innerHTML = '<div class="box" role="dialog" aria-modal="true"><p>' + esc(msg) + '</p><div class="acts"><button type="button" class="btn line" data-r="0">취소</button><button type="button" class="btn" data-r="1">' + esc(okLabel || '확인') + '</button></div></div>';
    document.body.appendChild(m);
    m.querySelector('[data-r="1"]').focus();
    m.addEventListener('click', function (e) {
      var b = e.target.closest('[data-r]');
      if (!b && e.target !== m) return;
      document.body.removeChild(m);
      resolve(!!(b && b.getAttribute('data-r') === '1'));
    });
  });
}

function loadData(quiet) {
  return call('getData', [S.token], quiet).then(function (d) {
    S.data = d; S.roles = d.roles || []; S.version = d.version; S.lastSync = new Date();
    if (!S.dirty) S.draftKey = null;
    return d;
  });
}

function go(screen, params) {
  S.screen = screen; S.params = params || {}; S.draftKey = null; S.dirty = false; S.err = {};

  window.scrollTo(0, 0);
}
function leave(screen, params) {

  } else go(screen, params);
}

function famMatches(f) {
  if ((S.tabNew === 'done') !== famDone(f)) return false;

  if (q && !f.all.some(function (p) { return (p['이름'] + ' ' + p['인도자']).indexOf(q) >= 0; })) return false;

  if (S.filterNew === 'done') return f.all.some(function (p) { return eduCount(p) === 4; });
  if (S.tabNew === 'done') return true;
  if (S.filterNew === 'nofarm') return f.all.some(function (p) { return p['목장연결'] !== 'Y'; });
  if (S.filterNew === 'ready') return famReady(f);
  return true;
}

  }

    var p = f.head, open = !!S.openFam[f.id], isFam = f.others.length > 0;

function loadFullPhoto() {
  var kind = S.screen === 'patDetail' ? 'patient' : 'new';
  var id = S.params.id;
  var p = kind === 'patient' ? findPat(id) : findNew(id);
  if (!p || !p.hasPhoto) return;
  var key = kind + id, stamp = p['수정일시'] + p['사진썸네일'].length;
  if (S.photo[key] && S.photo[key].stamp === stamp) return;

/* 엑셀로 한 번에 등록 */
var BULK_COLS = ['가족번호', '신앙세대주', '관계', '이름', '성별', '연생', '등록일', '인도자', '전도회', '목장', '신급', '1강', '2강', '3강', '4강', '등록심방', '수료식'];
var COL_ALIASES = {
  '이름': ['이름', '성명', '성함', '이름(필수)'], '성별': ['성별'], '연생': ['연생', '생년', '출생연도', '출생년도', '생년월일', '년생'],
  '등록일': ['등록일', '등록일자', '등록날짜'], '인도자': ['인도자', '전도자'], '전도회': ['전도회'], '목장': ['목장', '목장명', '소속목장'],
  '신급': ['신급'], '가족번호': ['가족번호', '가정번호', '가족', '가정'], '신앙세대주': ['신앙세대주', '세대주'], '관계': ['관계', '가족관계'],
  '등록심방': ['등록심방', '심방'], '수료식': ['수료식', '수료']
};
function canonCol(h) {
  var x = String(h || '').replace(/[\s*]/g, '');
  var m = /^(새가족)?(교육)?([1-4])강/.exec(x);
  if (m) return m[3] + '강';
  for (var k in COL_ALIASES) if (COL_ALIASES[k].indexOf(x) >= 0) return k;
  return '';
}
function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
var xlsxLoading = null;
function loadXlsx() {
  if (window.XLSX) return Promise.resolve();
  if (xlsxLoading) return xlsxLoading;
  xlsxLoading = new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = function () { resolve(); };
    s.onerror = function () { xlsxLoading = null; reject(new Error('엑셀 읽기 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.')); };
    document.head.appendChild(s);
  });
  return xlsxLoading;
}
function parseSheetFile(file) {
  return loadXlsx().then(function () {
    return file.arrayBuffer();
  }).then(function (buf) {
    var wb = XLSX.read(buf, { type: 'array', cellNF: true });
    var name = wb.SheetNames.indexOf('일괄입력') >= 0 ? '일괄입력' : wb.SheetNames[0];
    var ws = wb.Sheets[name], aoa = [];
    if (ws['!ref']) {
      var rg = XLSX.utils.decode_range(ws['!ref']);
      for (var rr = rg.s.r; rr <= rg.e.r; rr++) {
        var line = [];
        for (var cc = rg.s.c; cc <= rg.e.c; cc++) {
          var cell = ws[XLSX.utils.encode_cell({ r: rr, c: cc })], v = '';
          if (cell) {
            if (cell.t === 'n' && cell.z && XLSX.SSF.is_date(cell.z)) {
              var dc = XLSX.SSF.parse_date_code(cell.v);
              v = dc ? dc.y + '-' + pad2(dc.m) + '-' + pad2(dc.d) : cell.v;
            } else if (cell.t === 'd') v = ymd(cell.v);
            else v = cell.v;
          }
          line.push(v);
        }
        aoa.push(line);
      }
    }
    var hi = -1, map = [];
    for (var i = 0; i < Math.min(aoa.length, 10); i++) {
      var cand = aoa[i].map(canonCol);
      if (cand.indexOf('이름') >= 0) { hi = i; map = cand; break; }
    }
    if (hi < 0) throw new Error('첫 줄에 "이름"(또는 성명) 칸이 있는 표를 찾지 못했어요.');
    var rows = [];
    for (var r = hi + 1; r < aoa.length; r++) {
      var o = { _row: r + 1 }, any = false;
      map.forEach(function (k, c) {
        if (!k) return;
        var v = aoa[r][c];
        if (v instanceof Date) v = ymd(v);
        v = String(v === null || v === undefined ? '' : v).trim();
        if (v) { o[k] = v; any = true; }
      });
      if (any) rows.push(o);
    }
    var used = {};
    map.forEach(function (k) { if (k) used[k] = 1; });
    return { rows: rows, cols: BULK_COLS.filter(function (k) { return used[k]; }), sheet: name };
  });
}

function markEmpty(e) { var el = e.target; if (el.type === 'date' && el.hasAttribute('data-ph')) el.setAttribute('data-empty', el.value ? '0' : '1'); }

document.addEventListener('change', markEmpty, true);
document.addEventListener('input', function (e) {
  var el = e.target;
  if (el.getAttribute('data-q') === 'new') { S.qNew = el.value; document.getElementById('listArea').innerHTML = newItems(); return; }
  if (el.getAttribute('data-q') === 'preg') { S.qPreg = el.value; document.getElementById('listArea').innerHTML = pregItems(); return; }
  if (el.getAttribute('data-q') === 'pat') { S.qPat = el.value; document.getElementById('listArea').innerHTML = patItems(); return; }
  if (el.getAttribute('data-code')) { S.code = el.value.replace(/\D/g, '').slice(0, 8); return; }
  var f = el.getAttribute('data-f');
  if (f && !el.getAttribute('data-ch') && S.draft) setPath(f, el.value);
});

var C = {
  set: function (el) { setPath(el.getAttribute('data-f'), el.value); rerender(); },
  gender: function (el) {
    setPath('성별', el.value);
    if (S.draft['전도회'] && missions(el.value).indexOf(S.draft['전도회']) < 0) S.draft['전도회'] = '';
    rerender();
  },
  edu: function (el) { var k = el.getAttribute('data-k'); S.draft[k] = el.checked ? (S.draft[k] || today()) : ''; S.dirty = true; rerender(); },
  uploadFile: function (el) {
    var f = el.files[0];
    if (!f) return;
    S.upload = { status: 'reading', fileName: f.name };
    rerender();
    parseSheetFile(f).then(function (p) {
      if (!p.rows.length) throw new Error('파일에서 사람을 찾지 못했어요. 2번째 줄부터 적혀 있는지 확인해 주세요.');
      S.upload.rows = p.rows; S.upload.cols = p.cols; S.upload.status = 'checking'; rerender();
      return call('bulkRegister', [S.token, p.rows, true]);
    }).then(function (res) {
      if (!res) return;
      S.upload.result = res; S.upload.status = 'ready'; rerender();
    }).catch(function (e) {
      S.upload = { status: 'idle', err: (e && e.message ? e.message : String(e)).replace(/^Error:\s*/, '') };
      rerender();
    });
  },
  ceremony: function (el) { S.draft['수료식'] = el.checked ? (S.draft['수료식'] || today()) : ''; S.dirty = true; rerender(); },
  year: function (el) { S.yearNew = el.value; rerender(); },
  visit: function (el) { S.draft['등록심방'] = el.checked ? (S.draft['등록심방'] || today()) : ''; S.dirty = true; rerender(); },
  farm: function (el) { S.draft['목장연결'] = el.value; if (el.value !== 'Y') S.draft['목장'] = ''; S.dirty = true; rerender(); },
  head1: function (el) { S.draft['신앙세대주'] = el.checked ? 'Y' : 'N'; S.dirty = true; },
  mode: function (el) { S.draft.mode = el.value; if (el.value === 'single') S.draft.members = S.draft.members.slice(0, 1); S.draft.members[0]['신앙세대주'] = 'Y'; S.dirty = true; rerender(); },
  regHead: function (el) { var i = Number(el.getAttribute('data-i')); S.draft.members.forEach(function (m, j) { m['신앙세대주'] = j === i ? 'Y' : 'N'; }); S.dirty = true; rerender(); },
  regPhoto: function (el) {
    var i = Number(el.getAttribute('data-i'));
    readPhoto(el.files[0]).then(function (ph) { if (ph) { S.draft.members[i].photo = ph; S.dirty = true; rerender(); } });
  },
  patPendingPhoto: function (el) { readPhoto(el.files[0]).then(function (ph) { if (ph) { S.draft.pendingPhoto = ph; S.dirty = true; rerender(); } }); },
  photo: function (el) {
    var kind = el.getAttribute('data-kind'), id = S.params.id;
    readPhoto(el.files[0]).then(function (ph) {
      if (!ph) return;
      return call('uploadPhoto', [S.token, kind, id, ph.full, ph.thumb]).then(function () {
        S.photo[kind + id] = { stamp: 'fresh', src: ph.full };
        var keep = S.dirty ? S.draft : null;
        return loadData().then(function () {
          if (keep) { S.draft = keep; S.dirty = true; }
          rerender(); toast('사진을 올렸어요.');
        });
      });
    }).catch(function () {});
  }
};
document.addEventListener('change', function (e) {
  var el = e.target, ch = el.getAttribute('data-ch');
  if (ch && C[ch]) C[ch](el);
});

function readPhoto(file) {
  if (!file) return Promise.resolve(null);
  if (!/^image\//.test(file.type)) { toast('사진 파일을 골라 주세요.'); return Promise.resolve(null); }
  return new Promise(function (resolve) {
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        function draw(max, q) {
          var s = Math.min(1, max / Math.max(img.width, img.height));
          var c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s));
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          return c.toDataURL('image/jpeg', q);
        }
        resolve({ full: draw(1200, 0.82), thumb: draw(160, 0.7) });
      };
      img.onerror = function () { toast('이 사진은 읽을 수 없어요. 다른 사진으로 해 주세요.'); resolve(null); };
      img.src = fr.result;
    };
    fr.onerror = function () { resolve(null); };
    fr.readAsDataURL(file);
  });
}

/* ---------- 버튼 동작 ---------- */
var A = {
  nav: function (el) { leave(el.getAttribute('data-to')); },
  back: function (el) { leave(el.getAttribute('data-to')); },
  key: function (el) { if (S.code.length < 8) S.code += el.getAttribute('data-k'); S.loginMsg = ''; rerender(); },
  keyDel: function () { S.code = S.code.slice(0, -1); rerender(); },
  keyOk: function () { submitCode(); },
  logout: function () {
    confirmBox('이 기기에서 나갈까요? 다시 쓰려면 코드를 입력해야 해요.', '나가기').then(function (ok) {
      if (!ok) return;
      var t = S.token;
      S.token = null; S.roles = []; S.data = null; store('yb_token', null);
      call('logout', [t], true).catch(function () {});
      S.loginMsg = ''; go('login');
    });
  },
  tabNew: function (el) { S.tabNew = el.getAttribute('data-v'); rerender(); },
  completeFam: function (el) {
    if (S.dirty) { toast('바꾼 내용을 먼저 저장해 주세요.'); return; }
    var id = el.getAttribute('data-id'), done = el.getAttribute('data-done') === '1';
    var f = families().filter(function (x) { return x.id === id; })[0];
    if (!f) return;
    var who = f.all.length > 1 ? f.head['이름'] + '님 가족 ' + f.all.length + '명을' : f.head['이름'] + '님을';
    var msg = done ? (famReady(f) ? who + ' 전체 완료 명단으로 옮길까요?' : '아직 마치지 않은 항목이 있어요. 그래도 ' + who + ' 전체 완료로 옮길까요?') : who + ' 다시 진행 중 목록으로 되돌릴까요?';
    confirmBox(msg, done ? '완료로 옮기기' : '되돌리기').then(function (ok) {
      if (!ok) return;
      call('completeFamily', [S.token, id, done]).then(function () { return loadData(); }).then(function () {
        S.tabNew = done ? 'done' : 'active'; S.filterNew = 'all';
        go('newList');
        toast(done ? '전체 완료 명단으로 옮겼어요.' : '진행 중으로 되돌렸어요.');
      }).catch(function () {});
    });
  },
  filterNew: function (el) { S.filterNew = el.getAttribute('data-v'); rerender(); },
  filterPat: function (el) { S.filterPat = el.getAttribute('data-v'); rerender(); },
  toggleFam: function (el) { var id = el.getAttribute('data-id'); S.openFam[id] = !S.openFam[id]; rerender(); },
  openNew: function (el) { go('newDetail', { id: el.getAttribute('data-id') }); },
  openPat: function (el) { go('patDetail', { id: el.getAttribute('data-id') }); },
  callToday: function () { S.draft['최근통화'] = today(); S.dirty = true; rerender(); },
  openPreg: function (el) { go('pregDetail', { id: el.getAttribute('data-id') }); },
  filterPreg: function (el) { S.filterPreg = el.getAttribute('data-v'); rerender(); },
  savePreg: function () {
    var id = S.params.id || '', d = S.draft, p = id ? findPreg(id) : {}, changes = {}, n = 0;
    if (!String(d['이름'] || '').trim()) { S.err.form = '이름을 적어 주세요.'; rerender(); return; }
    if (d['연생'] && !/^\d{4}$/.test(d['연생'])) { S.err.form = '연생은 1992처럼 네 자리로 적어 주세요.'; rerender(); return; }
    if (d['조리원입소'] && d['조리원퇴소'] && d['조리원퇴소'] < d['조리원입소']) { S.err.form = '조리원 퇴소일이 입소일보다 빨라요.'; rerender(); return; }
    PREG_EDITABLE.forEach(function (k) { if ((d[k] || '') !== (p[k] || '')) { changes[k] = d[k] || ''; n++; } });
    if (!n) { toast('바뀐 내용이 없어요.'); return; }
    S.err = {};
    call('savePregnancy', [S.token, id, changes]).then(function () {
      S.dirty = false; S.draftKey = null;
      return loadData().then(function () { go('pregList'); toast('저장했어요.'); });
    }).catch(function () {});
  },
  delPreg: function () {
    var p = findPreg(S.params.id);
    confirmBox(p['이름'] + '님을 임신 명단에서 지울까요? 되돌릴 수 없어요.', '지우기').then(function (ok) {
      if (!ok) return;
      call('deletePregnancy', [S.token, p.ID]).then(function () { return loadData(); }).then(function () { go('pregList'); toast('명단에서 지웠어요.'); }).catch(function () {});
    });
  },
  newRegister: function () { go('newRegister', {}); },
  openUpload: function () { S.upload = { status: 'idle' }; leave('newUpload'); },
  uploadCommit: function () {
    var U = S.upload;
    U.status = 'saving'; rerender();
    call('bulkRegister', [S.token, U.rows, false]).then(function (res) {
      S.upload = { status: 'idle' };
      return loadData().then(function () {
        S.tabNew = 'active'; S.filterNew = 'all';
        go('newList');
        toast(res.people + '명(' + res.families + '가정)을 등록했어요.' + (res.errors.length ? ' ' + res.errors.length + '줄은 뺐어요.' : ''));
      });
    }).catch(function () { U.status = 'ready'; rerender(); });
  },
  addFamily: function (el) { leave('newRegister', { familyId: el.getAttribute('data-id') }); },
  addMember: function () { S.draft.members.push(blankMember(false)); S.dirty = true; rerender(); },
  removeMember: function (el) {
    var i = Number(el.getAttribute('data-i'));
    var wasHead = S.draft.members[i]['신앙세대주'] === 'Y';
    S.draft.members.splice(i, 1);
    if (wasHead && S.draft.members.length && !S.params.familyId) S.draft.members[0]['신앙세대주'] = 'Y';
    S.dirty = true; rerender();
  },
  saveNew: function () {
    var p = findNew(S.params.id), d = S.draft, changes = {}, n = 0;
    if (!String(d['이름'] || '').trim()) { S.err.form = '이름을 적어 주세요.'; rerender(); return; }
    if (d['연생'] && !/^\d{4}$/.test(d['연생'])) { S.err.form = '연생은 1978처럼 네 자리로 적어 주세요.'; rerender(); return; }
    NEW_EDITABLE.forEach(function (k) { if ((d[k] || '') !== (p[k] || '')) { changes[k] = d[k] || ''; n++; } });
    if (!n) { toast('바뀐 내용이 없어요.'); return; }
    S.err = {};
    call('updateNewcomer', [S.token, p.ID, changes]).then(function () {
      S.dirty = false; S.draftKey = null;
      var f = familyOf(p);
      if (f && f.all.length > 1) S.openFam[f.id] = true;
      return loadData();
    }).then(function () { go('newList'); toast('저장했어요.'); }).catch(function () {});
  },
  delNew: function () {
    var p = findNew(S.params.id);
    confirmBox(p['이름'] + '님을 새가족 명단에서 지울까요? 되돌릴 수 없어요.', '지우기').then(function (ok) {
      if (!ok) return;
      call('deleteNewcomer', [S.token, p.ID]).then(function () { return loadData(); }).then(function () { go('newList'); toast('명단에서 지웠어요.'); }).catch(function () {});
    });
  },
  saveReg: function () {
    var d = S.draft, famId = S.params.familyId || '';
    var bad = d.members.filter(function (m) { return !String(m['이름'] || '').trim(); }).length;
    if (bad) { S.err.form = '이름을 모두 적어 주세요.'; rerender(); return; }
    if (d.members.some(function (m) { return m['연생'] && !/^\d{4}$/.test(m['연생']); })) { S.err.form = '연생은 1982처럼 네 자리로 적어 주세요.'; rerender(); return; }
    S.err = {};
    var members = d.members.map(function (m) { return { '이름': m['이름'].trim(), '관계': m['관계'], '성별': m['성별'], '연생': m['연생'], '신앙세대주': famId ? 'N' : m['신앙세대주'] }; });
    call('registerNewcomers', [S.token, { familyId: famId, common: d.common, members: members }]).then(function (res) {
      var ups = d.members.map(function (m, i) { return m.photo ? function () { return call('uploadPhoto', [S.token, 'new', res.ids[i], m.photo.full, m.photo.thumb]); } : null; }).filter(Boolean);
      return ups.reduce(function (pr, f) { return pr.then(f); }, Promise.resolve()).then(function () { return res; });
    }).then(function (res) {
      S.dirty = false;
      S.openFam[res.familyId] = true;
      return loadData().then(function () { go('newList'); toast(d.members.length > 1 ? d.members.length + '명을 등록했어요.' : '등록했어요.'); });
    }).catch(function () {});
  },
  savePat: function () {
    var id = S.params.id || '', d = S.draft, p = id ? findPat(id) : {}, changes = {}, n = 0;
    if (!String(d['이름'] || '').trim()) { S.err.form = '이름을 적어 주세요.'; rerender(); return; }
    if (d['연생'] && !/^\d{4}$/.test(d['연생'])) { S.err.form = '연생은 1951처럼 네 자리로 적어 주세요.'; rerender(); return; }
    PAT_EDITABLE.forEach(function (k) { if ((d[k] || '') !== (p[k] || '')) { changes[k] = d[k] || ''; n++; } });
    if (!n && !d.pendingPhoto) { toast('바뀐 내용이 없어요.'); return; }
    S.err = {};
    var pending = d.pendingPhoto;
    call('savePatient', [S.token, id, changes]).then(function (res) {
      if (pending) return call('uploadPhoto', [S.token, 'patient', res.id, pending.full, pending.thumb]).then(function () { return res; });
      return res;
    }).then(function (res) {
      S.dirty = false; S.draftKey = null;
      return loadData().then(function () {
        go('patList');
        toast('저장했어요.');
      });
    }).catch(function () {});
  },
  delPat: function () {
    var p = findPat(S.params.id);
    confirmBox(p['이름'] + '님을 환우 명단에서 지울까요? 되돌릴 수 없어요.', '지우기').then(function (ok) {
      if (!ok) return;
      call('deletePatient', [S.token, p.ID]).then(function () { return loadData(); }).then(function () { go('patList'); toast('명단에서 지웠어요.'); }).catch(function () {});
    });
  }
};
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var fn = A[el.getAttribute('data-act')];
  if (fn) { e.preventDefault(); fn(el, e); }
});

document.addEventListener('keydown', function (e) {
  if (S.screen !== 'login' || document.querySelector('.modal')) return;
  if (/^\d$/.test(e.key)) { if (S.code.length < 8) S.code += e.key; S.loginMsg = ''; rerender(); e.preventDefault(); }
  else if (e.key === 'Backspace') { S.code = S.code.slice(0, -1); rerender(); e.preventDefault(); }
  else if (e.key === 'Enter') { submitCode(); e.preventDefault(); }
});

function submitCode() {
  if (S.code.length < 4) { S.loginMsg = '코드를 끝까지 입력해 주세요.'; rerender(); return; }
  var code = S.code;
  call('login', [code, DEVICE, S.token || '']).then(function (res) {
    S.code = '';
    if (!res.ok) { S.loginMsg = res.msg; rerender(); return; }
    S.token = res.token; S.roles = res.roles; store('yb_token', res.token);
    S.loginMsg = '';
    return loadData().then(function () {
      go((res.added === 'newEdit' || res.added === 'newView') ? 'newList' : 'home');
    });
  }).catch(function () { S.code = ''; rerender(); });
}

/* ---------- 실시간 반영 ---------- */
function poll() {
  if (!S.token || document.hidden || S.busy || S.screen === 'login') return;
  call('getVersion', [S.token], true).then(function (v) {
    if (v !== S.version) {
      return loadData(true).then(function () { if (!S.dirty && !document.querySelector('.modal')) rerender(); });
    }
    S.lastSync = new Date();
    var l = document.getElementById('syncLabel'); if (l) l.textContent = '방금 동기화됨';
  }).catch(function () {});
}
setInterval(poll, 30000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });

/* ---------- 시작 ---------- */
S.token = load('yb_token');
if (S.token) {
  render();
  loadData(true).then(function () { go('home'); }).catch(function () { if (S.screen === 'loading') go('login'); });
} else {
  go('login');
}
})();
</script>
</body>
</html>
