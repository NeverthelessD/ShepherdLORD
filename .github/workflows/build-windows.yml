name: build-windows

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'scripts/ci-windows.ps1'
      - 'scripts/push-ci-results.sh'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build, smoke test, package
        shell: pwsh
        run: ./scripts/ci-windows.ps1

      - name: Publish results to ci-results/windows
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci-out
          echo "commit=$GITHUB_SHA" >> ci-out/status.txt
          bash scripts/push-ci-results.sh windows ci-out
