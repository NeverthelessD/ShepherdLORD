name: build-windows

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'scripts/ci-windows.ps1'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build, smoke test, package
        shell: pwsh
        run: ./scripts/ci-windows.ps1

      - name: Publish results to ci-results branch
        if: always()
        shell: bash
        run: |
          mkdir -p ci-out
          echo "commit=$GITHUB_SHA" >> ci-out/status.txt
          cd ci-out
          git init -q
          git checkout -q -b ci-results
          git add -A
          git -c user.name="Nevertheless_D" -c user.email="NeverthelessD@users.noreply.github.com" commit -qm "windows ci $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-results
